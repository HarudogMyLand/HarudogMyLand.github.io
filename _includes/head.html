{% include base_path %}

<meta charset="utf-8">

<script>
(function() {
  const storedTheme = localStorage.getItem('theme');
  const isBlogPage = {% if page.collection == 'posts' or page.url == '/year-archive/' or page.blog_column %}true{% else %}false{% endif %};
  const isBare = isBlogPage && localStorage.getItem('blogTheme') === 'bare';
  if (storedTheme === 'dark' && !isBare) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">

<meta http-equiv="cleartype" content="on">
