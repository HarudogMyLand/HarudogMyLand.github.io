<details class="blog-theme-picker">
  <summary>
    <i class="fas fa-palette" aria-hidden="true"></i>
    <span>Style</span>
    <b data-blog-theme-label>Tutorial</b>
  </summary>
  <div class="blog-theme-picker__options" role="group" aria-label="Choose blog style">
    <button type="button" data-blog-theme-choice value="tutorial">Tutorial</button>
    <button type="button" data-blog-theme-choice value="source">Source</button>
    <button type="button" data-blog-theme-choice value="gov">Gov</button>
    <button type="button" data-blog-theme-choice value="marx">Archive</button>
    <button type="button" data-blog-theme-choice value="bare">Bare</button>
  </div>
</details>
