# Text for the blog home (/year-archive/), the archive hub (/archive/) and the
# column block on posts. Pages pick a language with `lang:` in their front
# matter; pages without one use `en`.
#
# The `js` maps are passed to assets/js/blog-home.js and assets/js/archive-hub.js.

en:
